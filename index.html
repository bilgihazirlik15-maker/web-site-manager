<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Web Site Manager</title>
    <link rel="icon" type="image/png" href="favicon.png" />
    <link rel="apple-touch-icon" href="favicon.png" />
    <link rel="stylesheet" href="site-manager.css" />
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar">
        <div class="brand">
          <div>
            <p class="eyebrow">Bağımsız panel</p>
            <h1>Web Site Manager</h1>
          </div>
          <div class="brand-actions">
            <button class="icon-button" id="addSiteButton" type="button" title="Site ekle" aria-label="Site ekle">
              <span aria-hidden="true">+</span>
            </button>
            <button class="icon-button" id="importButton" type="button" title="Listeyi içe aktar" aria-label="Listeyi içe aktar">
              <span aria-hidden="true">↑</span>
            </button>
            <button class="icon-button" id="exportButton" type="button" title="Listeyi dışa aktar" aria-label="Listeyi dışa aktar">
              <span aria-hidden="true">↓</span>
            </button>
            <input id="importFile" type="file" accept="application/json,.json" hidden />
          </div>
        </div>

        <div class="toolbar">
          <div class="filters">
            <label class="search">
              <span>Ara</span>
              <input id="searchInput" type="search" list="categoryOptions" placeholder="Kategori seç veya ara" />
              <datalist id="categoryOptions"></datalist>
            </label>
            <div class="view-toggle" role="group" aria-label="Görünüm seçimi">
              <button class="toggle-button active" id="allButton" type="button">Tümü</button>
              <button class="toggle-button" id="favoriteButton" type="button">Favoriler</button>
            </div>
          </div>
          <div class="analog-clock" aria-label="Analog saat">
            <span class="clock-hand hour-hand" id="hourHand"></span>
            <span class="clock-hand minute-hand" id="minuteHand"></span>
            <span class="clock-hand second-hand" id="secondHand"></span>
            <span class="clock-center"></span>
          </div>
        </div>
      </header>

      <section class="card-workspace" aria-labelledby="collectionTitle">
        <div class="section-heading">
          <div>
            <p class="eyebrow">Kayıtlı bağlantılar</p>
            <h2 id="collectionTitle">Web siteleri</h2>
            <p class="drag-hint">Kartları tutup sürükleyerek sıralayabilirsiniz.</p>
          </div>
          <div class="selection-panel" aria-label="Seçili site işlemleri">
            <p id="selectedSiteLabel">İşlem yapmak için bir kart seçin.</p>
            <div class="selection-actions">
              <button class="selection-button" id="selectedPinButton" type="button" disabled>Sabitle</button>
              <button class="selection-button" id="selectedFavoriteButton" type="button" disabled>Favori</button>
              <button class="selection-button" id="selectedEditButton" type="button" disabled>Düzenle</button>
              <button class="selection-button danger" id="selectedRemoveButton" type="button" disabled>Sil</button>
            </div>
          </div>
        </div>
        <section class="site-list" id="siteList" aria-label="Kayıtlı siteler"></section>
      </section>
    </main>

    <div class="modal-backdrop" id="siteModal" aria-hidden="true">
      <section class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
        <div class="modal-header">
          <div>
            <p class="eyebrow" id="modalEyebrow">Yeni kayıt</p>
            <h2 id="modalTitle">Web sitesi ekle</h2>
          </div>
          <button class="icon-button" id="closeModalButton" type="button" title="Kapat" aria-label="Kapat">
            <span aria-hidden="true">×</span>
          </button>
        </div>

        <form class="site-form" id="siteForm" autocomplete="off">
          <label>
            Site adı
            <input id="siteName" name="name" type="text" placeholder="Örn. Haber paneli" required />
          </label>
          <label>
            Site adresi
            <input id="siteUrl" name="url" type="url" placeholder="https://example.com" required />
          </label>
          <label>
            Grup
            <input id="siteGroup" name="group" type="text" placeholder="İş, okul, araçlar..." />
          </label>
          <div class="modal-actions">
            <button class="secondary-button" id="cancelModalButton" type="button">Vazgeç</button>
            <button class="primary-button" id="submitSiteButton" type="submit">Site ekle</button>
          </div>
        </form>
      </section>
    </div>

    <script src="site-manager.js?v=20260825-1"></script>
  </body>
</html>
